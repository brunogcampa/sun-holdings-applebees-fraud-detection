resources:
  pipelines:
    applebees_phase2:
      name: applebees-phase2-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      development: true
      edition: ADVANCED
      configuration:
        applebees.source_root: ${var.source_root}
        applebees.start_date: ${var.start_date}
        applebees.end_date: ${var.end_date}
      libraries:
        - file:
            path: ../../src/transformations/silver/mv_checks_cleaned.py
        - file:
            path: ../../src/transformations/gold/mv_executive_kpis.sql
        - file:
            path: ../../src/transformations/gold/mv_quality_metrics.sql
